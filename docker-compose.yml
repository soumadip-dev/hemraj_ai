services:
  postgres:
    image: postgres:16
    container_name: hemraj_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hemraj}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: hemraj_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  server:
    build:
      context: .
    container_name: hemraj_server
    restart: unless-stopped

    environment:
      PORT: ${PORT:-8080}
      NODE_ENV: ${NODE_ENV:-development}

      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-hemraj}
      REDIS_URL: redis://redis:6379

      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}

      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_TOKEN_SECRET}
      JWT_ACCESS_TOKEN_EXPIRY: ${JWT_ACCESS_TOKEN_EXPIRY:-1d}

      JWT_REFRESH_TOKEN_SECRET: ${JWT_REFRESH_TOKEN_SECRET}
      JWT_REFRESH_TOKEN_EXPIRY: ${JWT_REFRESH_TOKEN_EXPIRY:-10d}

      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-gemini-3.5-flash-lite}

    depends_on:
      - postgres
      - redis

    ports:
      - '${PORT:-8080}:8080'

volumes:
  postgres_data:
  redis_data:
